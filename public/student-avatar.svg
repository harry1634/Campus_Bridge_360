<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320">
  <defs>
    <linearGradient id="hoodie" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <!-- soft blob backdrop -->
  <ellipse cx="230" cy="180" rx="160" ry="130" fill="#eef2ff"/>
  <ellipse cx="120" cy="260" rx="60" ry="14" fill="#e2e8f0"/>

  <!-- plant -->
  <g transform="translate(70,190)">
    <rect x="-14" y="20" width="28" height="26" rx="4" fill="#f59e0b"/>
    <path d="M0,20 C-4,0 -20,-6 -28,-20 C-10,-16 -2,-2 0,10 Z" fill="#059669"/>
    <path d="M0,20 C4,-4 18,-10 26,-26 C10,-20 2,-4 0,10 Z" fill="#10b981"/>
  </g>

  <!-- desk -->
  <rect x="40" y="230" width="320" height="14" rx="4" fill="#cbd5e1"/>

  <!-- laptop -->
  <g transform="translate(150,168)">
    <rect x="0" y="0" width="110" height="70" rx="6" fill="#1e293b"/>
    <rect x="6" y="6" width="98" height="58" rx="3" fill="#3b82f6" opacity="0.85"/>
    <rect x="-6" y="70" width="122" height="8" rx="3" fill="#0f172a"/>
  </g>

  <!-- chair -->
  <rect x="205" y="150" width="16" height="90" rx="6" fill="#94a3b8"/>

  <!-- body: hoodie -->
  <path d="M150,240 C150,170 175,120 220,120 C265,120 290,170 290,240 Z" fill="url(#hoodie)"/>
  <!-- hoodie pocket -->
  <rect x="195" y="200" width="50" height="26" rx="10" fill="#1d4ed8" opacity="0.6"/>

  <!-- arms typing -->
  <path d="M175,200 C165,215 165,230 175,240" fill="none" stroke="url(#hoodie)" stroke-width="22" stroke-linecap="round"/>
  <path d="M265,200 C275,215 275,230 265,240" fill="none" stroke="url(#hoodie)" stroke-width="22" stroke-linecap="round"/>
  <circle cx="178" cy="243" r="11" fill="#fcd9b8"/>
  <circle cx="262" cy="243" r="11" fill="#fcd9b8"/>

  <!-- neck + head -->
  <rect x="208" y="95" width="24" height="30" fill="#fcd9b8"/>
  <circle cx="220" cy="80" r="38" fill="#fcd9b8"/>

  <!-- hair -->
  <path d="M182,80 C182,45 258,45 258,80 C258,60 182,60 182,80 Z" fill="#1c1109"/>
  <path d="M182,72 C178,90 182,102 190,110" fill="none" stroke="#1c1109" stroke-width="8" stroke-linecap="round"/>
  <path d="M258,72 C262,90 258,102 250,110" fill="none" stroke="#1c1109" stroke-width="8" stroke-linecap="round"/>

  <!-- face -->
  <circle cx="206" cy="82" r="3.5" fill="#1e293b"/>
  <circle cx="234" cy="82" r="3.5" fill="#1e293b"/>
  <path d="M208,98 C214,104 226,104 232,98" fill="none" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>

  <!-- hoodie strings -->
  <line x1="210" y1="128" x2="206" y2="150" stroke="#1d4ed8" stroke-width="4" stroke-linecap="round"/>
  <line x1="230" y1="128" x2="234" y2="150" stroke="#1d4ed8" stroke-width="4" stroke-linecap="round"/>

  <!-- floating success chip -->
  <g transform="translate(300,70)">
    <rect x="-40" y="-18" width="80" height="36" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
    <circle cx="-18" cy="0" r="8" fill="#059669"/>
    <path d="M-22,0 l3,4 l6,-8" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="-2" y="-5" width="30" height="4" rx="2" fill="#cbd5e1"/>
    <rect x="-2" y="2" width="20" height="4" rx="2" fill="#e2e8f0"/>
  </g>
</svg>
