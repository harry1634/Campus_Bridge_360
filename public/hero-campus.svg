<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="45%" stop-color="#2563eb"/>
      <stop offset="75%" stop-color="#0891b2"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <radialGradient id="glow" cx="30%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="vignette" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.1"/>
      <stop offset="55%" stop-color="#0f172a" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="skin1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fcd9b8"/>
      <stop offset="100%" stop-color="#f4b98a"/>
    </linearGradient>
    <linearGradient id="skin2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a5a3b"/>
      <stop offset="100%" stop-color="#6b4226"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <circle cx="1250" cy="200" r="260" fill="url(#glow)"/>
  <circle cx="250" cy="650" r="300" fill="url(#glow)"/>

  <!-- confetti / celebration particles -->
  <g opacity="0.85">
    <rect x="180" y="120" width="10" height="10" fill="#f59e0b" transform="rotate(20 185 125)"/>
    <rect x="320" y="80" width="8" height="8" fill="#ffffff" transform="rotate(-15 324 84)"/>
    <circle cx="420" cy="150" r="5" fill="#f59e0b"/>
    <rect x="520" y="60" width="9" height="9" fill="#5eead4" transform="rotate(35 524 64)"/>
    <circle cx="640" cy="100" r="4" fill="#ffffff"/>
    <rect x="760" y="70" width="8" height="8" fill="#f59e0b" transform="rotate(10 764 74)"/>
    <circle cx="880" cy="140" r="5" fill="#5eead4"/>
    <rect x="1000" y="90" width="9" height="9" fill="#ffffff" transform="rotate(-20 1004 94)"/>
    <circle cx="1120" cy="60" r="4" fill="#f59e0b"/>
    <rect x="1300" y="120" width="8" height="8" fill="#5eead4" transform="rotate(25 1304 124)"/>
    <circle cx="1420" cy="80" r="5" fill="#ffffff"/>
  </g>

  <!-- ============ LEFT FIGURE: graduate throwing cap ============ -->
  <g transform="translate(300,470)">
    <!-- graduation cap flying up -->
    <g transform="translate(40,-260) rotate(-18)">
      <polygon points="-70,0 70,0 0,-32" fill="#0f172a"/>
      <rect x="-78" y="-2" width="156" height="10" rx="3" fill="#0f172a"/>
      <line x1="0" y1="6" x2="4" y2="70" stroke="#f59e0b" stroke-width="4"/>
      <circle cx="4" cy="74" r="8" fill="#f59e0b"/>
    </g>

    <!-- body -->
    <path d="M-55,90 C-55,10 -30,-40 0,-40 C30,-40 55,10 55,90 Z" fill="#1d4ed8"/>
    <!-- gown collar -->
    <path d="M-24,-30 L0,10 L24,-30" fill="none" stroke="#f8fafc" stroke-width="6" stroke-linecap="round"/>
    <!-- raised arm -->
    <path d="M40,-20 C70,-60 80,-120 70,-160" fill="none" stroke="#1d4ed8" stroke-width="26" stroke-linecap="round"/>
    <circle cx="68" cy="-166" r="15" fill="url(#skin1)"/>
    <!-- other arm -->
    <path d="M-40,0 C-65,20 -70,55 -55,80" fill="none" stroke="#1d4ed8" stroke-width="24" stroke-linecap="round"/>
    <circle cx="-56" cy="84" r="14" fill="url(#skin1)"/>
    <!-- head -->
    <circle cx="0" cy="-70" r="38" fill="url(#skin1)"/>
    <path d="M-38,-78 C-38,-110 38,-110 38,-78 C38,-96 -38,-96 -38,-78 Z" fill="#3b2314"/>
    <!-- legs -->
    <rect x="-26" y="86" width="20" height="70" rx="8" fill="#0f172a"/>
    <rect x="6" y="86" width="20" height="70" rx="8" fill="#0f172a"/>
  </g>

  <!-- ============ RIGHT FIGURE: second graduate celebrating ============ -->
  <g transform="translate(520,500)">
    <g transform="translate(-30,-230) rotate(14)">
      <polygon points="-60,0 60,0 0,-28" fill="#0f172a"/>
      <rect x="-66" y="-2" width="132" height="9" rx="3" fill="#0f172a"/>
      <line x1="0" y1="5" x2="-3" y2="60" stroke="#5eead4" stroke-width="4"/>
      <circle cx="-3" cy="64" r="7" fill="#5eead4"/>
    </g>

    <path d="M-48,80 C-48,10 -26,-36 0,-36 C26,-36 48,10 48,80 Z" fill="#0891b2"/>
    <path d="M-20,-28 L0,8 L20,-28" fill="none" stroke="#f8fafc" stroke-width="5" stroke-linecap="round"/>
    <path d="M-36,-16 C-62,-50 -68,-100 -58,-136" fill="none" stroke="#0891b2" stroke-width="22" stroke-linecap="round"/>
    <circle cx="-57" cy="-142" r="13" fill="url(#skin2)"/>
    <path d="M36,-6 C58,14 62,46 50,68" fill="none" stroke="#0891b2" stroke-width="20" stroke-linecap="round"/>
    <circle cx="51" cy="72" r="12" fill="url(#skin2)"/>
    <circle cx="0" cy="-62" r="34" fill="url(#skin2)"/>
    <path d="M-34,-70 C-34,-98 34,-98 34,-70 C34,-86 -34,-86 -34,-70 Z" fill="#1c1109"/>
    <rect x="-22" y="76" width="18" height="62" rx="8" fill="#0f172a"/>
    <rect x="6" y="76" width="18" height="62" rx="8" fill="#0f172a"/>
  </g>

  <!-- ============ CENTER-RIGHT: handshake (recruiter + student) ============ -->
  <g transform="translate(980,560)">
    <!-- recruiter (suit) -->
    <g transform="translate(-90,0)">
      <path d="M-50,80 C-50,10 -28,-42 0,-42 C28,-42 50,10 50,80 Z" fill="#1e293b"/>
      <path d="M-14,-34 L0,-2 L14,-34" fill="none" stroke="#f8fafc" stroke-width="6" stroke-linecap="round"/>
      <rect x="-6" y="-28" width="12" height="46" fill="#f59e0b"/>
      <path d="M30,-10 C55,4 66,20 66,40" fill="none" stroke="#1e293b" stroke-width="22" stroke-linecap="round"/>
      <circle cx="0" cy="-64" r="34" fill="url(#skin1)"/>
      <path d="M-32,-72 C-32,-98 32,-98 32,-72 C32,-86 -32,-86 -32,-72 Z" fill="#2b2b2b"/>
    </g>
    <!-- student -->
    <g transform="translate(90,0) scale(-1,1)">
      <path d="M-50,80 C-50,10 -28,-42 0,-42 C28,-42 50,10 50,80 Z" fill="#4f46e5"/>
      <path d="M-14,-34 L0,-2 L14,-34" fill="none" stroke="#f8fafc" stroke-width="6" stroke-linecap="round"/>
      <path d="M30,-10 C55,4 66,20 66,40" fill="none" stroke="#4f46e5" stroke-width="22" stroke-linecap="round"/>
      <circle cx="0" cy="-64" r="34" fill="url(#skin2)"/>
      <path d="M-32,-72 C-32,-98 32,-98 32,-72 C32,-86 -32,-86 -32,-72 Z" fill="#1c1109"/>
    </g>
    <!-- clasped hands -->
    <ellipse cx="0" cy="30" rx="22" ry="13" fill="url(#skin1)"/>
    <!-- briefcase -->
    <g transform="translate(-140,60)">
      <rect x="-22" y="-6" width="44" height="34" rx="4" fill="#f59e0b"/>
      <rect x="-8" y="-14" width="16" height="10" rx="2" fill="none" stroke="#f59e0b" stroke-width="3"/>
      <rect x="-22" y="6" width="44" height="4" fill="#0f172a" opacity="0.3"/>
    </g>
  </g>

  <!-- floating resume/document card -->
  <g transform="translate(1230,340) rotate(8)">
    <rect x="-55" y="-70" width="110" height="140" rx="8" fill="#ffffff" opacity="0.95"/>
    <rect x="-38" y="-48" width="76" height="8" rx="3" fill="#2563eb"/>
    <rect x="-38" y="-30" width="60" height="5" rx="2" fill="#cbd5e1"/>
    <rect x="-38" y="-18" width="60" height="5" rx="2" fill="#cbd5e1"/>
    <rect x="-38" y="-6" width="46" height="5" rx="2" fill="#cbd5e1"/>
    <rect x="-38" y="14" width="76" height="18" rx="4" fill="#059669" opacity="0.85"/>
  </g>

  <!-- bottom vignette for text contrast -->
  <rect x="0" y="0" width="1600" height="900" fill="url(#vignette)"/>
</svg>
